name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Django Test
    uses: ./.github/workflows/test.yml

  versioning:
    name: Check version bump
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.compare.outputs.bumped }}
      version: ${{ steps.local.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read local version
        id: local
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', open('src/django_dataclassconf/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read latest version from PyPI
        id: remote
        run: |
          REMOTE=$(curl -s https://pypi.org/pypi/django-dataclassconf/json | python -c "import sys, json; print(json.load(sys.stdin).get('info', {}).get('version', ''))" || echo "")
          echo "version=$REMOTE" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.local.outputs.version }}" != "${{ steps.remote.outputs.version }}" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${{ steps.remote.outputs.version }} -> ${{ steps.local.outputs.version }}"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged (${{ steps.local.outputs.version }}); skipping build/publish."
          fi

  build:
    name: Build Project
    needs: [test, versioning]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.versioning.outputs.bumped == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    name: Upload to PyPI
    needs: [test, versioning, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.versioning.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-dataclassconf/
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag release commit
        run: |
          VERSION="v${{ needs.versioning.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.versioning.outputs.version }}
          generate_release_notes: true
          files: dist/*